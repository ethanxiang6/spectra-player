name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the APK to (leave empty to skip)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Repository secret: your Spotify Client ID (PKCE needs no client secret).
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      # Optional stable signing key (see README, "Build the APK on GitHub").
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional: a stable signing key so the APK's SHA-1 matches the one registered in the
      # Spotify dashboard. Without these secrets the APK is signed with a throwaway debug key.
      - name: Restore signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ci.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ci.keystore" >> "$GITHUB_ENV"

      - name: Check Client ID is set
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ]; then
            echo "::warning::SPOTIFY_CLIENT_ID secret is empty. The APK will build but sign-in will not work."
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # Surfaces compiler errors as a single annotation (readable from the run page and the API).
      - name: Summarize build errors
        if: failure()
        run: |
          grep -E '(^e: |error:|What went wrong|Execution failed|Could not |Manifest merger|AAPT|Caused by:|Unresolved)' build.log \
            | head -150 | cut -c1-400 > errors.txt || true
          body=$(cat errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Build errors::${body}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spectra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee test.log

      - name: Summarize test failures
        if: failure()
        run: |
          grep -E '(^e: |FAILED|AssertionError|Exception|What went wrong|Execution failed|expected|error:)' test.log \
            | head -80 | cut -c1-300 > errors.txt || true
          body=$(cat errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Test errors::${body}"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Attaches the freshly built APK to an existing GitHub release (manual runs only).
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: spectra-debug-apk
          path: apk

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          src=$(ls apk/*.apk | head -n 1)
          name="Spectra-${TAG}-debug.apk"
          cp "$src" "$name"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Spectra $TAG" \
              --notes "Debug build. Sign-in needs the redirect URI spectra://callback registered in the Spotify dashboard; the login screen's setup details panel shows the exact values."
          fi
          gh release upload "$TAG" "$name" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached $name ($(stat -c %s "$name") bytes) to release $TAG"
