name: Screenshots

# Renders the app pages with made-up data (Paparazzi, no phone needed) so the design can be
# checked before a release. The PNGs are uploaded as an artifact and, zipped, to a
# "ui-preview" pre-release (not an app release; it holds no APK).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Record screenshots
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew -Pscreenshots :app:recordPaparazziDebug --tests '*ChartScreensTest*' --stacktrace --console=plain 2>&1 | tee shots.log

      - name: Summarize errors
        if: failure()
        run: |
          grep -E '(^e: |error:|What went wrong|Execution failed|Could not |Caused by:|Unresolved|FAILED|Exception)' shots.log \
            | head -150 | cut -c1-400 > errors.txt || true
          body=$(cat errors.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          echo "::error title=Screenshot errors::${body}"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/snapshots/images/
          if-no-files-found: error

      - name: Publish to the ui-preview pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=ui-preview
          (cd app/src/test/snapshots/images && zip -q "$GITHUB_WORKSPACE/screenshots.zip" *.png)
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "UI preview (screenshots, not an app release)" \
              --notes "Design screenshots made by the Screenshots workflow. There is no APK here."
          fi
          gh release upload "$tag" screenshots.zip --clobber --repo "$GITHUB_REPOSITORY"
